<script>
(function(){
  var mb=document.getElementById('mbtn');
  var mp=document.getElementById('mpanel');
  if(!mb||!mp||mb.getAttribute('data-gs-hu-menu')==='1') return;
  mb.setAttribute('data-gs-hu-menu','1');
  var locked=false;
  function setM(o){
    var was=mb.getAttribute('aria-expanded')==='true';
    mb.setAttribute('aria-expanded', o?'true':'false');
    mb.setAttribute('aria-label', o?'메뉴 닫기':'메뉴 열기');
    mp.hidden=!o;
    if(o){
      if(!locked){ document.body.style.overflow='hidden'; locked=true; }
    } else if(locked){
      document.body.style.overflow='';
      locked=false;
    }
    if(!o && was) try{mb.focus();}catch(err){}
  }
  mb.addEventListener('click', function(){ setM(mb.getAttribute('aria-expanded')!=='true'); });
  mp.addEventListener('click', function(e){ if(e.target===mp || (e.target.closest && e.target.closest('a'))) setM(false); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && mb.getAttribute('aria-expanded')==='true') setM(false); });
  if(window.matchMedia){
    var mq=window.matchMedia('(min-width:1024px)');
    var onQ=function(ev){ if(ev.matches) setM(false); };
    if(mq.addEventListener) mq.addEventListener('change', onQ);
    else if(mq.addListener) mq.addListener(onQ);
  }
})();
</script>
